<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Password | Library Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .password-card {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #667eea;
            color: white;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.12);
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            margin-top: 8px;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            display: block !important;
            background: #e8f8ee;
            color: #1f7a42;
        }

        .error {
            display: block !important;
            background: #fdeaea;
            color: #b42318;
        }
    </style>
</head>

<body>

    <div class="password-card">

        <div class="icon">
            🔐
        </div>

        <h1>Change Password</h1>

        <p class="subtitle">
            For security, you must change your temporary password
            before accessing the Admin Dashboard.
        </p>

        <form id="changePasswordForm">

            <div class="form-group">
                <label for="currentPassword">
                    Current Password
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    placeholder="Enter current password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="8"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit" id="changePasswordButton">
                Change Password
            </button>

        </form>

        <div id="message"></div>

    </div>


    <script>

        const form = document.getElementById("changePasswordForm");

        const button =
            document.getElementById("changePasswordButton");

        const message =
            document.getElementById("message");


        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const currentPassword =
                document.getElementById("currentPassword").value;

            const newPassword =
                document.getElementById("newPassword").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const adminToken =
                localStorage.getItem("adminToken");


            // Check token
            if (!adminToken) {

                message.textContent =
                    "Admin session not found. Please login again.";

                message.className = "error";

                return;
            }


            // Check password match
            if (newPassword !== confirmPassword) {

                message.textContent =
                    "New password and confirm password do not match.";

                message.className = "error";

                return;
            }


            // Check minimum length
            if (newPassword.length < 8) {

                message.textContent =
                    "New password must be at least 8 characters long.";

                message.className = "error";

                return;
            }


            button.disabled = true;
            button.textContent = "Changing Password...";


            try {

                const response = await fetch(
                    "http://localhost:5000/api/auth/admin-change-password",
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json",
                            "Authorization":
                                `Bearer ${adminToken}`
                        },

                        body: JSON.stringify({
                            currentPassword: currentPassword,
                            newPassword: newPassword,
                            confirmPassword: confirmPassword
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    message.textContent =
                        data.message ||
                        "Unable to change password.";

                    message.className = "error";

                    button.disabled = false;
                    button.textContent = "Change Password";

                    return;
                }


                message.textContent =
                    "Password changed successfully! Redirecting...";

                message.className = "success";


                // Update saved user information
                const loggedInUser =
                    JSON.parse(
                        localStorage.getItem("loggedInUser")
                    );

                if (loggedInUser) {

                    loggedInUser.mustChangePassword = false;

                    localStorage.setItem(
                        "loggedInUser",
                        JSON.stringify(loggedInUser)
                    );
                }


                // Go to Admin Dashboard
                setTimeout(function () {

                    window.location.href =
                        "admin-dashboard.html";

                }, 1200);


            } catch (error) {

                console.error(
                    "Change Password Error:",
                    error
                );

                message.textContent =
                    "Unable to connect to server.";

                message.className = "error";

                button.disabled = false;
                button.textContent = "Change Password";
            }

        });

    </script>

</body>
</html>
