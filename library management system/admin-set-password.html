<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Admin Password | Library Management System</title>

    <link rel="stylesheet" href="admin-set-password.css">
</head>

<body>

    <div class="page">

        <div class="card">

            <div class="logo">
                📚
            </div>

            <h1>Set Your Admin Password</h1>

            <p class="subtitle">
                Create a secure password for your College Admin account.
            </p>

            <form id="passwordForm">

                <div class="form-group">

                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter new password"
                        minlength="8"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >

                </div>

                <div id="message"></div>

                <button
                    type="submit"
                    id="submitBtn"
                >
                    Set Password
                </button>

            </form>

            <a href="index.html" class="back-link">
                Back to Login
            </a>

        </div>

    </div>

    <script src="admin-set-password.js"></script>

</body>
</html>
