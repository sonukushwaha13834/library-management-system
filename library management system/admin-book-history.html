<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book History - Admin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #1f2937;
        }

        .page-container {
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .header-left h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        .header-left p {
            color: #6b7280;
            font-size: 14px;
        }

        .back-btn {
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .history-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #f1f5f9;
            padding: 14px;
            text-align: left;
            font-size: 13px;
            color: #475569;
            white-space: nowrap;
        }

        td {
            padding: 15px 14px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
            white-space: nowrap;
        }

        tr:hover {
            background: #f8fafc;
        }

        .student-name {
            font-weight: 600;
            color: #111827;
        }

        .book-title {
            font-weight: 600;
            color: #2563eb;
        }

        .fine {
            font-weight: 600;
            color: #dc2626;
        }

        .no-fine {
            color: #16a34a;
            font-weight: 600;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-approved {
            background: #dcfce7;
            color: #15803d;
        }

        .status-returned {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-pending {
            background: #fef3c7;
            color: #b45309;
        }

        .status-rejected {
            background: #fee2e2;
            color: #dc2626;
        }

        .empty-history {
            text-align: center;
            padding: 50px 20px;
            color: #6b7280;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .page-container {
                padding: 15px;
            }

            .header {
                align-items: flex-start;
                gap: 15px;
                flex-direction: column;
            }

            .header-left h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="page-container">

        <div class="header">
            <div class="header-left">
                <h1>📖 Book History</h1>
                <p>View all issued and returned book records</p>
            </div>

            <a href="admin-dashboard.html" class="back-btn">
                ← Back to Dashboard
            </a>
        </div>

        <div class="history-card">

            <table>
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Book</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                        <th>Return Date</th>
                        <th>Fine</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="admin-history-list">
                    <!-- History will load here -->
                </tbody>
            </table>

            <div id="empty-history" class="empty-history" style="display: none;">
                No book history found.
            </div>

        </div>

    </div>

    <script src="admin-book-history.js"></script>

</body>
</html>
