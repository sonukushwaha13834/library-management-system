<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Management System | Forgot Password</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <!-- Background -->
        <div class="background-overlay"></div>


        <!-- =========================
             LEFT SIDE
        ========================== -->

        <section class="welcome-section">

            <div class="welcome-content">

                <div class="brand">
                    <span class="brand-icon">📚</span>
                    <span>LIBRARY SYSTEM</span>
                </div>

                <h1>
                    Reset your
                    <span>Password</span>
                </h1>

                <div class="blue-line"></div>

                <p>
                    Securely recover your library account
                </p>

            </div>

        </section>


        <!-- =========================
             RIGHT SIDE
        ========================== -->

        <section class="login-section">

            <div class="login-card">

                <!-- HEADER -->

                <div class="login-header">

                    <div class="book-icon">
                        🔐
                    </div>

                    <h2>Forgot Password?</h2>

                    <p>
                        Reset your library account password
                    </p>

                </div>


                <!-- =========================
                     STEP 1 : EMAIL
                ========================== -->

                <form
                    class="login-form"
                    id="forgotPasswordForm"
                >

                    <div class="form-group">

                        <label for="resetEmail">
                            Registered Email
                        </label>

                        <div class="input-box">

                            <input
                                type="email"
                                id="resetEmail"
                                placeholder="Enter your registered email"
                                required
                            >

                            <span class="input-icon">
                                ✉️
                            </span>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="login-button"
                        id="sendResetOtpButton"
                    >
                        Send OTP
                        <span>→</span>
                    </button>

                </form>


                <!-- =========================
                     STEP 2 : OTP
                ========================== -->

                <div
                    id="resetOtpSection"
                    style="display: none;"
                >

                    <form
                        class="login-form"
                        id="resetOtpForm"
                    >

                        <div class="form-group">

                            <label for="resetOtp">
                                Verification Code
                            </label>

                            <div class="input-box">

                                <input
                                    type="text"
                                    id="resetOtp"
                                    placeholder="Enter 6-digit OTP"
                                    maxlength="6"
                                    inputmode="numeric"
                                >

                                <span class="input-icon">
                                    🔢
                                </span>

                            </div>

                        </div>


                        <p
                            id="otpMessage"
                            style="text-align: center;"
                        >
                            Enter the OTP to continue
                        </p>


                        <button
                            type="submit"
                            class="login-button"
                        >
                            Verify OTP
                            <span>✓</span>
                        </button>

                    </form>

                </div>


                <!-- =========================
                     STEP 3 : NEW PASSWORD
                ========================== -->

                <div
                    id="newPasswordSection"
                    style="display: none;"
                >

                    <form
                        class="login-form"
                        id="newPasswordForm"
                    >

                        <div class="form-group">

                            <label for="newPassword">
                                New Password
                            </label>

                            <div class="input-box">

                                <input
                                    type="password"
                                    id="newPassword"
                                    placeholder="Create new password"
                                >

                                <span class="input-icon">
                                    🔒
                                </span>

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="confirmNewPassword">
                                Confirm New Password
                            </label>

                            <div class="input-box">

                                <input
                                    type="password"
                                    id="confirmNewPassword"
                                    placeholder="Confirm new password"
                                >

                                <span class="input-icon">
                                    🔒
                                </span>

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="login-button"
                        >
                            Reset Password
                            <span>✓</span>
                        </button>

                    </form>

                </div>


                <!-- =========================
                     BACK TO LOGIN
                ========================== -->

                <div class="signup">

                    <span>
                        Remember your password?
                    </span>

                    <a
                        href="index.html"
                        class="signup-button"
                    >
                        Log in
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- JavaScript -->

    <script src="forgot-password.js"></script>

</body>

</html>
